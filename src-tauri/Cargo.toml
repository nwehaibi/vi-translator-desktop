[package]
name = "vi-translator"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
# the reading and translating (shared with the phone apps)
vi-translator-core = { path = "../core" }
# PS5 remote play (chiaki-ng, built from source)
vi-translator-ps = { path = "../ps" }
# Xbox Remote Play with the app's own player (webrtc-rs)
vi-translator-xbox = { path = "../xbox" }
tokio = { version = "1", features = ["time"] }
anyhow = "1.0.104"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
# fork: to name the process's TLS crypto provider (fork_cmds::install_tls_provider; see FORK.md): the rustls
# already built here for reqwest (aws-lc-rs) and webrtc's DTLS (ring), no new crate
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.10"
tauri = { version = "2", features = ["custom-protocol"] }
# the snapshot's keyboard shortcut, pressed in the game
tauri-plugin-global-shortcut = "2.4.1"
ed25519-dalek = "2"
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }

# the free offline translator (OPUS-MT on ONNX Runtime), wherever ONNX Runtime has a build: not on
# Intel Macs, whose app translates with the reviewed translations and the online services
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
vi-translator-core = { path = "../core", features = ["offline"] }

# Windows: OCR, window capture, capture cards and fonts through the system's own APIs
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Media_Ocr", "Graphics_Imaging", "Globalization", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_WinRT", "Win32_Graphics_DirectWrite", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Registry", "Win32_Security", "Win32_System_Threading", "Graphics_Capture", "Security_Authorization_AppCapabilityAccess", "Win32_Devices_Display", "Win32_System_Time"] }
windows-capture = "2.0.1"
# the page as WebView2 draws it (Debugging: save the preview); the version Tauri uses
webview2-com = "0.39.1"

# Windows and macOS: the capture card's sound on the speakers (Linux would need ALSA's headers)
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"

# Linux and macOS: window capture, capture cards, fonts, folders, local time
[target.'cfg(not(windows))'.dependencies]
xcap = "0.9"
nokhwa = { version = "0.10", features = ["input-native"] }
fontdb = "0.24"
ttf-parser = "0.25"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Linux OCR: Tesseract (needs libtesseract and libleptonica; English data)
[target.'cfg(target_os = "linux")'.dependencies]
tesseract = "0.15"

# macOS OCR: Apple Vision
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSString", "NSError", "NSValue", "NSGeometry"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGColorSpace", "CGDataProvider", "CGWindow", "CGGeometry"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFCGTypes", "CFArray", "CFDictionary", "CFNumber", "CFString"] }

[build-dependencies]
tauri-build = "2"
