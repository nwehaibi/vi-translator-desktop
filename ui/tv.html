<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VI Translator for TV</title>
    <link rel="stylesheet" href="fonts.css" />
    <style>
      /* The VI Translator app shows this page, transparent, over the game picture on the TV:
         only the translation is drawn, where the overlays would be (as on the OBS page). */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #areas, #screen { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
      .band { position: absolute; }
    </style>
  </head>
  <body>
    <div id="areas"></div>
    <div id="screen"></div>
    <script src="common.js"></script>
    <script>
      // The same drawing as obs.html; the state comes from tv.json, which waits for a change
      // (each answer says its version, sent back as h=), so a new line shows at once.
      const areasEl = document.getElementById("areas");
      const screenEl = document.getElementById("screen");
      let state = null;
      let version = "";
      let build = null; // the app's run this page's code came from
      // this TV's key, given when it was connected in the app (the page answers connected TVs only)
      const key = new URLSearchParams(location.search).get("t") || "";

      function clear() {
        areasEl.innerHTML = "";
        screenEl.innerHTML = "";
      }

      function draw() {
        if (!state) return;
        const W = window.innerWidth, H = window.innerHeight;
        const k = H / 1080; // style sizes are for 1080p
        areasEl.innerHTML = "";
        const probe = document.createElement("div");
        areasEl.appendChild(probe);
        // Overlays switched off in the app: nothing on the TV either
        if (state.overlays === false) {
          screenEl.innerHTML = "";
          return;
        }
        if (!state.screen) {
          for (const a of state.areas) {
            const ev = state.shown[a.id];
            const cover = (state.covers || {})[a.id] || null;
            if (!a.enabled || ((!ev || !ev.segments || !ev.segments.length) && !cover)) continue;
            const px = { x: a.x * W, y: a.y * H, w: a.w * W, h: a.h * H };
            const r = AS.rectFor(a.placement, px, W, H, a);
            const band = document.createElement("div");
            band.className = "band";
            Object.assign(band.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
            const box = document.createElement("div");
            band.appendChild(box);
            areasEl.appendChild(band);
            AS.anchor(band, a.placement, a);
            // (the profile's look: over the game's lines on a black box, or the area's own placement;
            // and with it the black box alone over text not translated yet)
            // (riding above stacked lines: placed by the other areas' too)
            const ride = AS.ridePlace(a, state.areas, state.area_fx, state.profile_opts, state.shown || {}, state.covers || {}, W, H,
              (f, e) => AS.measureBox(probe, f, state.style, state.profile_opts, e, k, H, a.w * W));
            AS.drawLine(box, a, state.style, state.profile_opts, state.area_fx, ev, cover, k, H, { W, H, ox: r.x, oy: r.y, areaW: px.w, areaH: px.h, ride });
          }
        }
        AS.renderScreen(screenEl, state.screen, state.reason || [], state.profile_opts);
        // (GTA VI's phone held up: its translations beside it)
        if (!state.screen && state.phone) {
          const ph = document.createElement("div");
          Object.assign(ph.style, { position: "absolute", left: "0", top: "0", width: W + "px", height: H + "px" });
          areasEl.appendChild(ph);
          AS.renderPhone(ph, state.phone);
        }
      }

      // A request the network dropped without a word (Wi-Fi) would wait forever and the page would stop:
      // each one has a time limit (the PC answers within about a second), then the next is asked.
      const timed = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error("no answer")), ms))]);
      // (tells the TV app the page is alive: it loads a page that went quiet again. Android TV gives the page
      // a VITTV object; on webOS the page is in a frame of the app, told with a message)
      function alive() {
        if (window.VITTV) window.VITTV.alive();
        try { if (window.parent !== window) window.parent.postMessage({ vit: "alive" }, "*"); } catch (e) {}
      }

      async function poll() {
        let wait = 0;
        try {
          const r = await timed(fetch(`tv.json?t=${encodeURIComponent(key)}&h=${encodeURIComponent(version)}`, { cache: "no-store" }), 6000);
          const arrived = performance.now(); // fork: (measurement log, below)
          alive();
          if (r.status === 200) {
            const next = await timed(r.json(), 6000);
            version = r.headers.get("X-State") || "";
            // the app was restarted (maybe updated): load its current code. A TV app that doesn't let the
            // page reload itself keeps this one going: it draws the new state, never stuck empty
            const restarted = build !== null && next.build !== build;
            build = next.build;
            state = next;
            AS.setLang(state.lang);
            draw();
            // fork: while the PC's measurement log is on, tell it once this state is painted (two animation
            // frames after drawing), with how long that took here since the answer arrived
            if (r.headers.get("X-Ack") === "1") {
              const drawn = version;
              requestAnimationFrame(() => requestAnimationFrame(() => {
                const ms = Math.round(performance.now() - arrived);
                fetch(`tv/drawn?t=${encodeURIComponent(key)}&h=${encodeURIComponent(drawn)}&draw=${ms}`, { cache: "no-store" }).catch(() => {});
              }));
            }
            if (restarted) location.reload();
          } else if (r.status !== 204) {
            // (sharing switched off, this TV removed in the app, or an older app without this page)
            if (state) { state = null; version = ""; clear(); }
            wait = 2000;
          }
        } catch (e) {
          // the app is closed or the PC is off: show nothing, keep trying
          if (state) { state = null; version = ""; clear(); }
          wait = 1000;
        }
        setTimeout(poll, wait);
      }
      window.addEventListener("resize", draw);
      document.fonts.ready.then(draw);
      poll();
    </script>
  </body>
</html>
